name: Update Widget Data

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche (UTC)
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de tu repositorio

permissions:
  contents: write # Permiso necesario para que el bot de GitHub pueda modificar y guardar el JSON

jobs:
  refresh-widget-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener datos de GitHub y actualizar JSON
        env:
          # Tu Personal Access Token (PAT) guardado en los Secrets de tu repositorio
          GH_TOKEN: ${{ secrets.READALL_KEY }}
        run: |
          python -c "
          import os, json, requests
          from datetime import datetime
          
          USERNAME = '${{ github.repository_owner }}'
          FILE_PATH = 'widget-api.json'
          
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ[\"GH_TOKEN\"]}'
          }
          
          # 1. Obtener total de commits y último commit
          url_commits = f'https://api.github.com/search/commits?q=author:{USERNAME}&sort=author-date&order=desc&per_page=1'
          res_commits = requests.get(url_commits, headers=headers)
          
          total_commits = 0
          latest_commit_millis = 0
          latest_commit_readable = 'N/A'
          
          if res_commits.status_code == 200:
              data_c = res_commits.json()
              total_commits = data_c.get('total_count', 0)
              items = data_c.get('items', [])
              if items:
                  commit_date_str = items[0]['commit']['author']['date']
                  # Reemplazar la zona horaria 'Z' por el formato ISO estándar compatible con Python
                  if commit_date_str.endswith('Z'):
                      commit_date_str = commit_date_str.replace('Z', '+00:00')
                  dt = datetime.fromisoformat(commit_date_str)
                  
                  # Tiempo en Milisegundos
                  latest_commit_millis = int(dt.timestamp() * 1000)
                  
                  # Formato exacto requerido: DD/MM/YY : HH:MIN:SS
                  latest_commit_readable = dt.strftime('%d/%m/%y : %H:%M:%S')
          else:
              print(f'Error en API de Commits: {res_commits.status_code}', res_commits.text)
          
          # 2. Obtener repositorios totales (Públicos + Privados)
          url_user = 'https://api.github.com/user'
          res_user = requests.get(url_user, headers=headers)
          
          total_repos = 0
          if res_user.status_code == 200:
              data_u = res_user.json()
              pub_repos = data_u.get('public_repos', 0)
              priv_repos = data_u.get('total_private_repos', 0)
              total_repos = pub_repos + priv_repos
          else:
              print(f'Error en API de Usuario: {res_user.status_code}', res_user.text)
              exit(1)
          
          # 3. Leer y actualizar widget-api.json existente
          if os.path.exists(FILE_PATH):
              with open(FILE_PATH, 'r', encoding='utf-8') as f:
                  try: data = json.load(f)
                  except json.JSONDecodeError: data = {}
          else:
              data = {}
          
          # Inyección limpia de los nuevos valores sin destruir los existentes
          data['total_commits'] = total_commits
          data['latest_commit_ms'] = latest_commit_millis
          data['latest_commit_date'] = latest_commit_readable
          data['total_repositories'] = total_repos
          
          with open(FILE_PATH, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          
          print(f'Datos actualizados: Commits={total_commits}, Repos={total_repos}, Fecha={latest_commit_readable}')
          "

      - name: Confirmar y subir cambios al repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add widget-api.json
          # Solo realiza el commit si el archivo realmente cambió de valor
          git diff-index --quiet HEAD || git commit -m '🤖 Auto-update: GitHub statistics for profile widget'
          git push
